[package]
name = "shmap"
version = "1.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.2", features = ["derive"] }
memchr = "2.8.3"
mimalloc = "0.1.52"
needletail = "0.7.3"
rustc-hash = "2.1.3"

[dev-dependencies]
assert_cmd = "2.2.2"
nthash = "0.5.1"
predicates = "3.1.4"
tempfile = "3.27.0"

# The hot loops (`sketch`, `populate_h2pos`, bucket merging) sit behind
# cross-crate calls into `needletail`/`rustc-hash` and behind generic
# boundaries the default 16 codegen units keep the optimizer from seeing
# through. `panic` is deliberately left at `unwind`: `map_reads` uses
# `catch_unwind` to isolate a panicking read, so `abort` would change
# behavior, not just codegen.
[profile.release]
lto = "fat"
codegen-units = 1
