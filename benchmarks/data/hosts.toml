# Benchmark hosts.
#
# One entry per machine that produces result sets. This is operational
# configuration — where the corpus lives, how many cores may be swept — kept
# apart from `suite.toml`, which defines *what* is measured and must stay
# identical across hosts for results to mean anything.
#
# `arch` must match what `uname -m` reports there, because that is what
# `layout.arch()` uses to choose the results directory. A mismatch here does
# not misfile anything (the runner never reads `arch` to decide where to
# write) — it just makes this file wrong, so keep it honest.
#
# A host may also override any wall-time threshold from suite.toml's
# [thresholds] by naming it here. Only the wall ones: accuracy thresholds
# describe the code and must not vary by machine, and compare.py enforces that
# by refusing any override outside its allow-list.
#
# `repeats` is how many times the *subject* implementation is measured for each
# (benchmark, metric, thread count); the runner takes the median. It lives here
# rather than in suite.toml because run-to-run noise is a property of the
# machine, and suite.toml has to define the same matrix everywhere for results
# to mean anything. More samples of one measurement improve the estimate
# without changing what is estimated. The reference implementation has its own
# count in suite.toml and is unaffected.
#
# `data_root` documents where that host's corpus lives. The runner does not
# read it: it resolves datasets through `benchmarks/data/files`, which is a
# gitignored symlink pointing at exactly this path. The value is recorded so
# a new host can be provisioned without anyone having to guess.
#
# `topology` states sockets, cores and NUMA nodes in a form a generated
# document can print. It duplicates what `notes` says in prose because a
# table cannot read prose, and this is the difference between the two hosts
# that most of the findings turn on.

schema = 1

[a2]
arch        = "x86_64"
address     = "192.168.191.2"
user        = "mpiuser"
cores       = 64
topology    = "4 sockets x 16 cores, 4 NUMA nodes"
thread_cap  = 64
# Three, because this host cannot resolve a few percent. Two runs of the
# identical commit a day apart disagreed on 73 of 105 rows by more than the 3%
# the gate reviews at; per-benchmark median |change| ran 3.1-8.0% and the worst
# row moved 21.1%. Every benchmark is affected, including the largest, and -@1
# has the highest median of any thread count, so there is no subset worth
# exempting. Costs ~3x the wall time of a run: about 4.2 h rather than 85 min.
# It improves the estimate without making the 3% threshold meaningful — median
# of three has ~0.67x the spread of one sample, so expect ~4.3% rather than
# ~6.4%. See results/suite-1.0/x86_64/ARCH.md.
repeats     = 3
# Wall-time thresholds this host can actually meet. suite.toml's 3% review line
# assumes a machine that can resolve 3%; two runs of one commit here put the
# geometric mean compare.py thresholds between -7.66% and +3.07%, flagging 11
# of 15 rows with nothing changed. 6% would have flagged 5, and with repeats=3
# should flag one or two. Accuracy thresholds are NOT overridden and never
# should be: a drop in mapped or mapq-60 reads blocks on any host.
# Provisional — see results/suite-1.0/x86_64/ARCH.md for how to re-derive it,
# and note that ~4 points of the movement is between-run drift that repeats
# cannot remove.
wall_regression_review = 0.06
wall_regression_block  = 0.12
data_root   = "/home/mpiuser"
notes       = "4x16 Xeon Gold 5218, 4 NUMA nodes, 376 GB. See results/suite-1.0/x86_64/ARCH.md."

[galaxy]
arch        = "aarch64"
address     = "192.168.191.12"
user        = "mpiuser"
cores       = 128
topology    = "1 socket x 128 cores, 1 NUMA node"
# Swept to 64, not 128, so both hosts sweep the same thread counts and the
# two result trees stay directly comparable. The spare cores are a separate
# question, not a change to the shared matrix.
thread_cap  = 64
# One. Two runs of the identical commit here agreed within ~1% on every row,
# and the indexing spread over a single run is 1.6% CV against a2's 7.0%.
# Repeats would buy this host almost nothing and cost it the same 3x.
repeats     = 1
data_root   = "/home/mpiuser"
notes       = "ARM Neoverse-N1, 1 socket, 1 NUMA node, 246 GB. The single NUMA node makes this the control for the Q4/Q5 findings. See results/suite-1.0/aarch64/ARCH.md."
