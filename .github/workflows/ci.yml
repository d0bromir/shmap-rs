# Cheap checks only. These run on GitHub-hosted, ephemeral runners, which is
# what makes them safe on pull requests from forks — the runner is disposable
# and holds no secret of ours.
#
# Benchmarks are deliberately NOT here: they execute the PR's code, so they run
# on the private host `a2` behind an authorization gate. See ../../SECURITY.md.
#
# ---------------------------------------------------------------------------
# Why this workflow uses no actions at all
# ---------------------------------------------------------------------------
# The repository is set to `allowed_actions: local_only`, meaning only actions
# stored in this repository may run — third-party ones, including
# `actions/checkout`, are refused and the run dies before any step executes.
# That setting is correct for a public repo: it reduces the supply-chain
# surface to zero. So this workflow conforms to it rather than asking for it to
# be loosened, and clones with plain git instead.
#
# The practical rule for anyone editing this file: **no `uses:` lines.** Adding
# one does not fail visibly — the whole run dies as `startup_failure` with an
# empty log and no annotation, which reads like a GitHub outage rather than a
# mistake in this file. It cost four silently-broken runs to notice.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: a compromised workflow cannot write to the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that is a property of the code on a given architecture. Both
  # are native runners; ARM ones are free for public repositories.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        env:
          # `github.token` is the ephemeral, read-only token for this run.
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git config --local advice.detachedHead false
          # The token goes through an auth header, not the remote URL, so it
          # cannot leak via `git remote -v` or a fetch error message.
          git remote add origin "https://github.com/${REPO}.git"
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD
          git --no-pager log --oneline -1

      - name: toolchain
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins an exact version; rustup fetches it on
          # first use. Do not `rustup default stable` here -- that would
          # install a toolchain the pin then ignores, and misleadingly print
          # a version this build does not use.
          command -v rustup >/dev/null || \
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          rustup show active-toolchain
          cargo --version && rustc --version

      # Fail loudly if the runner is not the architecture the matrix claims,
      # rather than silently testing x86 twice and reporting ARM as green.
      - name: runner really is ${{ matrix.arch }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          echo "uname -m = $actual, matrix says ${{ matrix.arch }}"
          test "$actual" = "${{ matrix.arch }}"

      - name: fmt
        run: cargo fmt --check

      - name: build
        run: cargo build --release --locked

      - name: clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: test (release)
        run: cargo test --release

      # Debug too: this is what activates the debug_assert!s guarding the
      # parallel index build and the two-pass FASTA reader.
      - name: test (debug)
        run: cargo test

      # Every benchmark path, and the architecture a run files itself under,
      # derive from layout.py. A wrong arch() would compare ARM numbers to
      # x86 ones and produce no error at all.
      - name: benchmark layout and architecture resolve correctly
        run: python3 benchmarks/scripts/test_layout.py

      - name: benchmark suite definition is consistent
        run: python3 benchmarks/scripts/validate_suite.py

      # compare.py decides whether a PR may merge, so a bug in it either waves
      # a regression through or blocks a good change. Cheap to check here.
      - name: merge-gate verdicts are correct
        run: python3 benchmarks/scripts/test_compare.py

      - name: concordance scoring is correct
        run: python3 benchmarks/scripts/test_concordance.py

      # Pesho's index/mapping time split (measure()) for a tool with no native
      # phase report depends on this slicing out exactly one record.
      - name: one_read_fasta isolates exactly the first record
        run: python3 benchmarks/scripts/test_run.py

      # A wrong chart looks as authoritative as a right one, so the
      # aggregation rule, the wedge maths and the partition guard are pinned.
      - name: profiling charts draw what they claim
        run: python3 benchmarks/scripts/test_charts.py

      # The only script allowed to put two machines' numbers in one table, so
      # what is pinned is that it refuses to compare what is not comparable
      # and shouts when the two runs disagree about the algorithm itself.
      - name: cross-architecture aggregation compares like with like
        run: python3 benchmarks/scripts/test_crossarch.py

      # The paper's prose is generated too, so it can be wrong in ways a table
      # cannot: a range built from two unrelated extremes, or a missing
      # measurement counted as agreement. Both are pinned here.
      - name: the manuscript's generated numbers are derived correctly
        run: python3 benchmarks/scripts/test_manuscript.py

      # The ladder is the only thing in the repo that claims what an
      # individual optimization is worth. A ladder that is not actually
      # cumulative, or that names a switch the binary does not have, still
      # typesets -- and attributes every step to the wrong change.
      - name: the ablation ladder is cumulative and complete
        run: python3 benchmarks/scripts/test_ablation.py

  # Generated artifacts are checked against a committed result set, and every
  # result set that exists today was measured on x86_64. Pinned with --arch so
  # the check does not depend on which runner it lands on.
  artifacts:
    name: generated artifacts match the result set
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git config --local advice.detachedHead false
          git remote add origin "https://github.com/${REPO}.git"
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

      # Same reason report.py --check exists: charts are generated and
      # committed, so a stale one is a silent lie about the current numbers.
      - name: charts match the current result set
        run: python3 benchmarks/scripts/charts.py --check --arch x86_64

      # Catches a hand-edited results table, which is how this repo previously
      # came to carry contradictory numbers.
      - name: RESULTS.md matches the current result set
        run: python3 benchmarks/scripts/report.py --check --arch x86_64

      # Same failure mode one step further out: a table in the paper draft that
      # no longer matches the measurement it claims to report. The artifacts are
      # a pure function of the result set, so this is a real equality check.
      - name: paper artifacts match the current result set
        run: python3 benchmarks/scripts/paper.py --check --arch x86_64

      # No --arch: this one is about every promoted architecture at once. With
      # only one promoted it passes without writing anything, so it is safe to
      # run here before the second machine's results land.
      - name: cross-architecture document matches every result set
        run: python3 benchmarks/scripts/crossarch.py --check

      # The same guarantee for the paper's prose. The macros must match the
      # result sets, and the draft must not have acquired a hand-typed number
      # that no re-measurement would ever update -- which is the failure mode
      # generated tables were introduced to remove and prose still had.
      # The companion note claims to account for every optimization. This is
      # what makes that claim checkable: a row added to PORT_CHANGES.md that
      # the table has not been regenerated for fails here, and one this repo
      # does not classify fails inside the generator by name.
      - name: the optimization table matches PORT_CHANGES.md
        run: python3 benchmarks/scripts/optimizations.py --check

      # The ablation ladder is the note's only measurement of what each
      # optimization is worth, and it is committed rather than re-measured
      # here -- CI runners are shared and their wall clocks mean nothing. What
      # is checked is that the figure still matches the ladder it was drawn
      # from, which is the same guarantee every other artifact gets. Pinned
      # with --arch for the reason the block above gives: the ladder needs a machine
      # that can hold the pre-optimization accumulator per worker, so it is measured
      # on the aarch64 host and pinned here rather than following the runner.
      - name: the ablation figure matches its ladder
        run: python3 benchmarks/scripts/ablation.py --check --arch aarch64

      - name: the manuscript's macros match the result sets
        run: python3 benchmarks/scripts/manuscript.py --check

      - name: neither note quotes a number it typed itself
        run: python3 benchmarks/scripts/manuscript.py --lint

      # The simulators produce the only datasets that can support an accuracy
      # claim, so a syntax error in them is a silent hole in the evidence.
      - name: simulation tooling runs
        run: |
          set -euo pipefail
          python3 -m py_compile simulate/*.py
          # End-to-end on a tiny synthetic reference: generate with known rates,
          # then confirm measure_error_rate.py recovers them. Catches a broken
          # generator, which would otherwise show up as a mysterious accuracy
          # regression much later.
          python3 - <<'PY'
          import random, pathlib
          rng = random.Random(0)
          seq = "".join(rng.choice("ACGT") for _ in range(400_000))
          pathlib.Path("/tmp/ref.fa").write_text(">chrT\n" + seq + "\n")
          PY
          python3 simulate/simulate_reads.py --ref /tmp/ref.fa --n 60 --len 20000 \
              --sub 0.01 -o /tmp/sim.fa
          python3 simulate/measure_error_rate.py --ref /tmp/ref.fa --reads /tmp/sim.fa \
              --sample 60 | tee /tmp/err.txt
          python3 - <<'PY'
          import re, sys
          t = open("/tmp/err.txt").read()
          got = float(re.search(r"implied total error rate\s+([0-9.]+)%", t).group(1))
          # Asked for 1%; the k-mer estimator is approximate, so allow a band.
          assert 0.7 <= got <= 1.3, f"generator/estimator disagree: {got}% for a 1% request"
          print(f"round-trip ok: requested 1.000%, recovered {got}%")
          PY
