# shmap-rs benchmark suite — the single definition of what gets measured.
#
# Consumed by run.py. Nothing here is duplicated in a script: if a parameter is
# not in this file, it is not passed to the binary.
#
# See ../VERSIONING.md for what the versions mean. In short:
#   suite_version MAJOR bump  -> results across the boundary are NOT comparable
#   suite_version MINOR bump  -> a benchmark was added; old rows stay comparable

schema = 1
suite_version = "1.1"
dataset_version = 2

# Two tiers, and the reasoning that rejected tiers is worth stating because it
# was right until it was not.
#
# This file used to say: "Full matrix, one tier — deliberately not split into a
# fast PR tier and a slow release tier: a gate that is skipped catches nothing,
# and this host is idle and free." That argument rests on a premise, which the
# same comment supplied: every benchmark costs minutes, and the whole PR run is
# ~78 min. Under that premise running everything every time is obviously right.
#
# The short-read benchmarks break the premise. B08 is 146 million reads, and
# shmap-rs needs ~10 h for it at -@32 on a2 — not because anything is wrong,
# but because its sketch is length-proportional and a 150 bp read is 1/160th of
# a 24 kb one, so per-read costs that amortise away on long reads dominate
# here. A gate that takes a day is a gate people route around, and "a gate that
# is skipped catches nothing" then argues for the opposite conclusion.
#
# So: `tier = "pr"` (the default when absent) is the gate, unchanged at ~78 min
# and still the full matrix for every long-read benchmark. `tier = "paper"` is
# measured on demand — `run.py --tier paper`, or by name with `--only` — like
# the external-mapper corpus, and for the same reason: it is expensive, it does
# not change between our commits, and re-running it per PR would burn hours
# reproducing a number we already have.
#
# Measured cost, from the times in ../RESULTS.md:
#
#   PR run, C++ cached          ~78 min   105 invocations   (shmap-rs only)
#   C++ re-measure, 3x median  ~187 min    45 invocations   (only when rebuilt)
#   both together              ~265 min   150 invocations
#   paper tier (B06-B08)        ~22 h       3 invocations   (on demand)
[run]
host = "a2"                       # must match datasets.tsv `host` for every dataset used
sequential = true                 # never two measured runs at once
warm_cache = true                 # cat reference and reads to /dev/null before each benchmark
repeats = 1                       # shmap-rs; see [run.reference_impl] for the C++
stdout = "file"                   # PAF is written, not discarded — checks need it

# The C++ varies ~8% run-to-run on this host, enough to move a speedup ratio by
# a tenth, so it is measured three times and the median taken.
[run.reference_impl]
repeats = 3
reduce = "median"

# Drift probe: measure part of the reference implementation on every run, even
# when --impls does not ask for it.
#
# compare.py normalises host drift against the reference, whose binary does not
# change between our commits, so its movement between two result sets is the
# host and nothing else. That was written assuming every run measured the C++.
# Once --impls defaulted to shmap-rs alone -- rightly, the full C++ matrix is
# 197 minutes -- there were never any reference measurements in common, so the
# correction never applied and said so in a note nobody was reading.
#
# Uncorrected drift is not small. Two runs of one commit on a2 differ by -3.90%
# in the geometric mean compare.py thresholds, and indexing, which does
# identical work in every row, moved -4.18% the same way.
#
# B05 and B02 are the two cheapest benchmarks: 8.5 and 15.3 minutes at three
# repeats, and six (benchmark, metric) keys between them, which is
# drift_min_samples. B04 alone would be 137 minutes.
#
# These rows are real measurements and are kept in the result set. Promotion
# merges them into the baseline's reference rows per key, so the benchmarks the
# probe does not cover keep their last full measurement rather than being
# dropped.
[run.drift_probe]
enabled = true
benchmarks = ["B05", "B02"]

# ---------------------------------------------------------------------------
# Implementations
# ---------------------------------------------------------------------------

[impl.shmap-rs]
binary = "{repo}/target/release/shmap"
version_cmd = "{binary} --version"
threads_flag = "-@"
supports_threads = true
profile_flag = "-x --profile-log {out}.json"
role = "subject"                  # rebuilt and re-measured on every run

[impl.cpp-shmap]
binary = "~/Pesho/shmap/release/shmap"
supports_threads = false          # single-threaded by design
role = "reference"                # re-measured only when the binary changes
# Upstream's Makefile adds -DTRACY_ENABLE unconditionally, which costs ~8.8%.
# run.py refuses to use a binary containing live Tracy symbols.
forbid_build_flag = "TRACY_ENABLE"

# ---------------------------------------------------------------------------
# Parameter sets — every flag actually passed, nothing implicit
# ---------------------------------------------------------------------------

[params.paper]
description = "Paper / Table-1 real-world parameters. Used for every headline number."
k = 25
hashratio = 0.01
threshold = 0.4
min_diff = 0.075
max_overlap = 0.3

[params.ont-k15]
description = "ONT-appropriate. k=25 exact seeds mostly do not survive ~5-10% error; this is what the minshmap ONT benchmark uses. NOT run by default — at whole-genome scale k=15 is the pathological regime (15-mers are hugely repetitive) and a single 92k-read run exceeded 2 881 s without finishing."
k = 15
hashratio = 0.0625
threshold = 0.15
min_diff = 0.075
max_overlap = 0.3
enabled = false

# Short reads. Identical to [params.paper] in every value except `hashratio`,
# deliberately: one variable changes, so a short-read row and a long-read row
# differ in the reads and the sampling density and in nothing else.
#
# WHY hashratio HAS TO CHANGE. shmap sketches a FRACTION of a read's k-mers, so
# the evidence a read carries is proportional to its length. A 150 bp read has
# 126 25-mers; at the paper's r = 0.01 it keeps 1.3 of them, and 0.99^126 = 28%
# of reads keep NONE. A read with an empty sketch is not reported as unmapped —
# it produces no PAF line at all — so the failure is invisible in a mapped-rate
# table. This is the design assumption meeting its limit, not a tuning choice.
#
# WHY 0.1. Measured, by mapping exact reference substrings whose true position
# is known, with benchmarks/scripts/probe_short_read_params.py:
#
#     r      sketch m   never attempted   placed correctly
#     0.01        1.3               27%             46.70%
#     0.04        5.0              0.5%             71.14%
#     0.10       12.6                0%             73.80%
#     0.25       31.5                0%             74.39%
#     1.00      126.0                0%             74.74%
#
# The curve is flat past 0.1: every k-mer in the read buys 0.94 points over
# sampling a tenth of them, for ten times the index. The ~75% ceiling is chrY,
# which is about half satellite, and is a property of that reference rather
# than of the mapper — the shape across r is what this chooses on.
#
# `k` stays at 25. AVITI UltraQ reads are high quality, so long exact k-mers
# survive; the problem is sampling density alone, and changing both would make
# the result uninterpretable.
[params.short-read]
description = "150 bp Illumina-class reads. [params.paper] with hashratio raised from 0.01 to 0.1, which is the lowest density that reaches the accuracy plateau — see the table above and probe_short_read_params.py."
k = 25
hashratio = 0.1
threshold = 0.4
min_diff = 0.075
max_overlap = 0.3

# ---------------------------------------------------------------------------
# Benchmarks
# ---------------------------------------------------------------------------

