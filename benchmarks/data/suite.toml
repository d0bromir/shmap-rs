# shmap-rs benchmark suite — the single definition of what gets measured.
#
# Consumed by run.py. Nothing here is duplicated in a script: if a parameter is
# not in this file, it is not passed to the binary.
#
# See ../VERSIONING.md for what the versions mean. In short:
#   suite_version MAJOR bump  -> results across the boundary are NOT comparable
#   suite_version MINOR bump  -> a benchmark was added; old rows stay comparable

schema = 1
suite_version = "1.0"
dataset_version = 1

# Full matrix, one tier — deliberately not split into a fast PR tier and a slow
# release tier: a gate that is skipped catches nothing, and this host is idle
# and free. Measured cost, from the times in ../RESULTS.md:
#
#   PR run, C++ cached          ~78 min   105 invocations   (shmap-rs only)
#   C++ re-measure, 3x median  ~187 min    45 invocations   (only when it is rebuilt)
#   both together              ~265 min   150 invocations
#
# The C++ is `role = "reference"`, so a normal PR does not re-run it — its
# numbers come from the cached set and the run takes ~78 min. B04 is 52 of
# those minutes on its own; drop it and the suite loses the only benchmark deep
# enough to read mapping scaling directly.
[run]
host = "a2"                       # must match datasets.tsv `host` for every dataset used
sequential = true                 # never two measured runs at once
warm_cache = true                 # cat reference and reads to /dev/null before each benchmark
repeats = 1                       # shmap-rs; see [run.reference_impl] for the C++
stdout = "file"                   # PAF is written, not discarded — checks need it

# The C++ varies ~8% run-to-run on this host, enough to move a speedup ratio by
# a tenth, so it is measured three times and the median taken.
[run.reference_impl]
repeats = 3
reduce = "median"

# Drift probe: measure part of the reference implementation on every run, even
# when --impls does not ask for it.
#
# compare.py normalises host drift against the reference, whose binary does not
# change between our commits, so its movement between two result sets is the
# host and nothing else. That was written assuming every run measured the C++.
# Once --impls defaulted to shmap-rs alone -- rightly, the full C++ matrix is
# 197 minutes -- there were never any reference measurements in common, so the
# correction never applied and said so in a note nobody was reading.
#
# Uncorrected drift is not small. Two runs of one commit on a2 differ by -3.90%
# in the geometric mean compare.py thresholds, and indexing, which does
# identical work in every row, moved -4.18% the same way.
#
# B05 and B02 are the two cheapest benchmarks: 8.5 and 15.3 minutes at three
# repeats, and six (benchmark, metric) keys between them, which is
# drift_min_samples. B04 alone would be 137 minutes.
#
# These rows are real measurements and are kept in the result set. Promotion
# merges them into the baseline's reference rows per key, so the benchmarks the
# probe does not cover keep their last full measurement rather than being
# dropped.
[run.drift_probe]
enabled = true
benchmarks = ["B05", "B02"]

# ---------------------------------------------------------------------------
# Implementations
# ---------------------------------------------------------------------------

[impl.shmap-rs]
binary = "{repo}/target/release/shmap"
version_cmd = "{binary} --version"
threads_flag = "-@"
supports_threads = true
profile_flag = "-x --profile-log {out}.json"
role = "subject"                  # rebuilt and re-measured on every run

[impl.cpp-shmap]
binary = "~/Pesho/shmap/release/shmap"
supports_threads = false          # single-threaded by design
role = "reference"                # re-measured only when the binary changes
# Upstream's Makefile adds -DTRACY_ENABLE unconditionally, which costs ~8.8%.
# run.py refuses to use a binary containing live Tracy symbols.
forbid_build_flag = "TRACY_ENABLE"

# ---------------------------------------------------------------------------
# Parameter sets — every flag actually passed, nothing implicit
# ---------------------------------------------------------------------------

[params.paper]
description = "Paper / Table-1 real-world parameters. Used for every headline number."
k = 25
hashratio = 0.01
threshold = 0.4
min_diff = 0.075
max_overlap = 0.3

[params.ont-k15]
description = "ONT-appropriate. k=25 exact seeds mostly do not survive ~5-10% error; this is what the minshmap ONT benchmark uses. NOT run by default — at whole-genome scale k=15 is the pathological regime (15-mers are hugely repetitive) and a single 92k-read run exceeded 2 881 s without finishing."
k = 15
hashratio = 0.0625
threshold = 0.15
min_diff = 0.075
max_overlap = 0.3
enabled = false

# The cumulative optimization ladder (benchmarks/scripts/ablation.py). Not a
# benchmark: no [[benchmark]] names it, and it is never part of the per-PR gate.
#
# WHY IT IS NOT [params.paper]. The ladder is measured on a chromosome-scale
# reference, because the pre-optimization bucket accumulator it has to be able
# to switch back on is sized by the reference over MIN_HALFLEN — ~15 GB per
# worker on the whole genome, which no laptop can hold once, let alone once per
# worker. What the mapping-side changes act on is the number of reference hits
# a read has to consider, and that is (reference size x sampling rate); cutting
# the reference by ~69x and leaving `hashratio` at 0.01 leaves a run in which
# `bucket_merge` is under 1% of the wall and every step in the ladder is
# smaller than the machine's own noise. Raising the sampling rate restores part
# of that product, which is the one knob that does so without changing what is
# being compared: every rung is measured at the same value, so it cancels out
# of every ratio the ladder reports.
#
# `k`, `threshold`, `min_diff` and `max_overlap` are [params.paper]'s exactly.
# Only the sampling rate differs, and it differs for a stated reason.
[params.ablation]
description = "Cumulative optimization ladder at chromosome scale. [params.paper] with hashratio raised from 0.01 to 0.05, so that per-read hit counts are within reach of a whole-genome run's and the ladder's steps clear the host's noise."
k = 25
hashratio = 0.05
threshold = 0.4
min_diff = 0.075
max_overlap = 0.3

# ---------------------------------------------------------------------------
# Benchmarks
# ---------------------------------------------------------------------------

[[benchmark]]
id = "B01"
title = "Real HiFi 23.2 kb, 1.11x — the headline C++ comparison"
reference = "REF-HS1"
reads = "D1-HIFI23K"
params = "paper"
metrics = ["Containment", "Jaccard", "bucket_SH"]
threads = [1, 2, 4, 8, 16, 32, 64]
reference_impl_threads = [1]
impls = ["shmap-rs", "cpp-shmap"]
checks = ["thread_determinism", "validate_paf", "impl_agreement"]
note = "Longest real reads available. 23.2 kb not 24.0: no real set gives both >=125k reads and a 24 kb mean."

[[benchmark]]
id = "B02"
title = "Simulated 24 kb, 0.96x — long reads with ground truth"
reference = "REF-HS1"
reads = "D2-SIM24K"
params = "paper"
metrics = ["Containment", "Jaccard", "bucket_SH"]
threads = [1, 2, 4, 8, 16, 32, 64]
reference_impl_threads = [1]
impls = ["shmap-rs", "cpp-shmap"]
checks = ["thread_determinism", "validate_paf", "ground_truth", "impl_agreement"]
note = "Simulated, so it carries ground truth and is the only accuracy check that catches stably-wrong output. Not evidence about real-data accuracy."

[[benchmark]]
id = "B03"
title = "Real HiFi 12.8 kb, 1x — the long-standing reference workload"
reference = "REF-HS1"
reads = "D3-HIFI1X"
params = "paper"
metrics = ["Containment", "Jaccard", "bucket_SH"]
threads = [1, 2, 4, 8, 16, 32, 64]
reference_impl_threads = [1]
impls = ["shmap-rs", "cpp-shmap"]
checks = ["thread_determinism", "validate_paf", "impl_agreement"]

[[benchmark]]
id = "B04"
title = "Real HiFi 12.8 kb, 10x — depth, where mapping dominates indexing"
reference = "REF-HS1"
reads = "D4-HIFI10X"
params = "paper"
metrics = ["Containment", "Jaccard", "bucket_SH"]
threads = [1, 2, 4, 8, 16, 32, 64]
reference_impl_threads = [1]
impls = ["shmap-rs", "cpp-shmap"]
checks = ["thread_determinism", "validate_paf", "impl_agreement"]
note = "~52 min of the ~78 min PR run, the single most expensive benchmark. Also the only one where indexing is a small enough share (~9% at -@32) for mapping scaling to be read directly, which is why it stays."

[[benchmark]]
id = "B05"
title = "Real ONT 23.8 kb, 0.70x — a different error profile"
reference = "REF-HS1"
reads = "D6-ONT24K"
params = "paper"
metrics = ["Containment", "Jaccard", "bucket_SH"]
threads = [1, 2, 4, 8, 16, 32, 64]
reference_impl_threads = [1]
impls = ["shmap-rs", "cpp-shmap"]
checks = ["thread_determinism", "validate_paf", "impl_agreement"]
note = "Maps ~43% at k=25 because ~5-10% error leaves only ~28% of 25-mers intact. Both implementations map identically many reads, so the speed comparison holds; the rate is the platform, not the mapper."

# ---------------------------------------------------------------------------
# Checks — every one of these blocks a merge if it fails. See ../VERSIONING.md.
# ---------------------------------------------------------------------------

[checks.thread_determinism]
description = "PAF identical across every thread count, after stripping the wall-clock t:f: tag."
blocking = true

[checks.validate_paf]
description = "Structural, score and span invariants via ../profiling/validate_paf.py."
blocking = true
tool = "{repo}/profiling/validate_paf.py"

[checks.ground_truth]
description = "Simulated reads land within one read length of their encoded true position."
blocking = true
# A backstop against gross breakage, NOT the regression gate. Drift is caught
# by compare.py, which blocks any drop against the baseline — output is
# deterministic, so a real change moves this number at all.
#
# Deliberately loose, because a tight absolute floor cannot do both jobs. The
# three metrics legitimately sit at different levels, measured on B02:
#
#   Containment  0.992064     mean target span 23 866 bp
#   Jaccard      0.989952     mean target span 23 777 bp
#   bucket_SH    0.987608     mean target span 30 941 bp
#
# bucket_SH does no refinement, so a mapping keeps the coarse bucket extent
# rather than being narrowed to the best window — ~30% wider than the 24 000 bp
# read. This check asks whether a mapping lands within one read length of its
# true position, so a wider span misses that window slightly more often. That
# is the metric working as designed.
#
# A 0.99 floor failed bucket_SH outright and put Jaccard 0.000048 under the
# line, where rounding decided the verdict. Both were the gate misfiring, not
# the mapper. 0.98 catches a mapper that is actually broken and leaves the
# drift detection to the comparison, which is better at it.
min_fraction = 0.98

[checks.impl_agreement]
description = "Fraction of the 12 core PAF columns matching the C++. Recorded always; only blocking if it drops versus the baseline."
blocking = false

# ---------------------------------------------------------------------------
# Per-read instrumentation for the scaling scatter
# ---------------------------------------------------------------------------

[per_read_stats]
# One extra invocation per listed benchmark, after the measured matrix, writing
# per-read time and match counts. It is a separate run on purpose: the row
# writing does not change the mapping, but it does change the wall clock of
# whatever run carries it, and that is the number the suite exists to report.
enabled = true
metric = "Containment"
threads = 1
# Every 10th read by index. The scatter needs the shape of the relationship,
# not every point: B04 alone would be 2.4 M rows and ~130 MB for a plot that a
# few thousand points already resolve. Sampling by index rather than at random
# keeps the selection reproducible and independent of thread count.
sample = 10
# B04 is excluded: it is the same reads as B03 at 10x depth, so it adds ~7
# minutes of single-threaded mapping and no new relationship between per-read
# match count and per-read time. B05 is included precisely because its reads
# mostly fail to map, which is the cheap end of the curve.
benchmarks = ["B01", "B02", "B03", "B05"]

[checks.wrong_q60]
description = "Simulated reads placed wrongly (mapeval criterion) while reporting mapq 60. Recorded always; only blocking if it rises versus the baseline."
blocking = false
# Not gated on an absolute floor, deliberately. The count is tiny and
# metric-dependent — 0 for Containment, 6 for Jaccard, 1 for bucket_SH on B02 —
# so any fixed threshold is either vacuous or a coin flip. What matters is the
# direction: a change that starts labelling wrong placements as confident is a
# regression however small the count, and compare.py blocks on the increase.
#
# This is the quantity a caller actually cares about. A wrong placement at
# mapq 0 is a declared ambiguity that any downstream filter removes; a wrong
# placement at mapq 60 is a falsehood that none of them can. Accuracy alone
# does not distinguish the two, which is why it is recorded separately rather
# than folded into ground_truth.

# ---------------------------------------------------------------------------
# Regression thresholds applied by compare.py
# ---------------------------------------------------------------------------

[thresholds]
# Divide shmap-rs's wall-time change by the reference implementation's change in
# the same pair of runs. The C++ binary does not change between our commits, so
# its movement is host drift and nothing else — a control that was already being
# measured every run and discarded. Without it, a run on a busier machine shifts
# every row together and the review line catches whichever benchmark sat nearest
# it, producing a REVIEW on byte-identical output.
drift_normalize = true
drift_min_samples = 6      # too few reference measurements to trust -> no correction
drift_max = 0.10           # beyond this the host changed state; flag, do not correct

wall_regression_review = 0.03     # >3% slower on any benchmark needs justification (host noise)
wall_regression_block = 0.10      # >10% blocks outright
peak_rss_regression_review = 0.05
mapped_regression_block = 0        # any drop in mapped reads blocks
mapq60_regression_block = 0        # any drop in mapq-60 reads blocks

# ---------------------------------------------------------------------------
# Reporting
# ---------------------------------------------------------------------------

[report]
# Benchmarks featured in README.md's at-a-glance table. Here rather than in
# report.py because which datasets front the project is an editorial decision,
# not a property of the code — and because a benchmark id belongs in the file
# that defines benchmark ids.
readme_highlight = ["B01", "B05"]
readme_labels = { B01 = "HiFi, 23.2 kb, 149 438 reads", B05 = "ONT, 23.8 kb, 92 220 reads" }

# ---------------------------------------------------------------------------
# External mappers — the concordance corpus
# ---------------------------------------------------------------------------
#
# These are run ONCE per (mapper, benchmark) by reference_mappers.py, and their
# PAFs are cached on the host. `run.py` never invokes them: a PR run scores
# shmap-rs against the cached output, which costs a join over two PAFs rather
# than another mapping pass.
#
# What they are and are not
# -------------------------
# Winnowmap2 is the most accurate long-read mapper available, and it is still
# NOT ground truth. Its output is an estimate; where it and shmap-rs disagree,
# nothing here says which is right. These numbers are CONCORDANCE, never
# accuracy, and must be reported as such. Accuracy comes from B02, whose reads
# carry true positions in their headers — that is the only gold standard in
# this suite.
#
# Winnowmap2's own accuracy claims were established on simulated reads with
# known variants (Nature Methods 2022, doi:10.1038/s41592-022-01457-8), not by
# scoring against another mapper. The field's most accurate mapper needed
# simulation to prove it, which is the whole argument for keeping B02 primary.
#
# Where the comparison is informative: repetitive regions, which is what
# Winnowmap2 was built for and where sketch-based mapping is most likely to be
# weak. Genome-wide, most mappers agree on the easy majority of HiFi reads, so
# a high overall number says less than the disagreements do.
[external]
enabled = true
cache_dir = "~/bench-refs"
# Overlap criterion from paftools.js mapeval, matching mapquik's own
# experiments/intersect_pafs.py: same target sequence, and
# intersection / (span of the two intervals' extremes) above this.
concordance_min_overlap = 0.1

[external.winnowmap2]
binary = "~/tools/Winnowmap/bin/winnowmap"
version_cmd = "{binary} --version"
cmd = "{binary} -W {repetitive} -t {threads} -x {preset} {reference} {reads}"
output = "stdout"
threads = 32
role = "gold"
# Per-reference repetitive k-mer set, built once by meryl. Winnowmap2's weighted
# minimizer sampling needs it; without -W it degrades towards plain minimap2, so
# reference_mappers.py refuses to run rather than produce a quietly weaker
# "gold standard". Named by REGISTRY ID, not by the FASTA's filename: a
# replaced reference gets a new id (VERSIONING.md §3), which forces the k-mer
# set to be rebuilt instead of silently reused against different sequence.
#   meryl count k=15 memory=64 threads=32 output REF-HS1.meryl hs1.fa
#   meryl print greater-than distinct=0.9998 REF-HS1.meryl > REF-HS1.repetitive.k15.txt
# For hs1 this yields 66 872 k-mers, ~0.02% of the distinct 15-mers, in ~25 min.
repetitive = "~/bench-refs/{reference_id}.repetitive.k15.txt"
note = "Emits PAF (no -a): we compare coordinates, and base-level alignment would cost far more for output we do not use."

[external.mapquik]
binary = "~/tools/mapquik/mapquik"
version_cmd = "{binary} --version"
cmd = "{binary} {reads} --reference {reference} --threads {threads} -p {out_prefix}"
output = "prefix"   # writes {out_prefix}.paf itself rather than to stdout
threads = 32
role = "peer"
# mapquik COUNTS NEWLINES AS BASES. Given a line-wrapped reference it reports
# coordinates in "file offset" space, not sequence space, and does so silently:
# against `hs1.fa` (wrapped at 50 columns) it reported every chromosome as
# exactly 1.02x its true length — 1 + 1/50 — and placed 3 of 39 965 simulated
# reads correctly. With a one-line reference it places 98.09% of them and
# reports chr1 at its true 248 387 328. mapquik's own experiments/chm13/ scripts
# use `chm13v2.0.oneline.fa` for this reason.
#
# Build it once per reference (~20 s for 3.1 Gbp):
#   awk '/^>/ {if (NR>1) printf "\n"; print; next} {printf "%s", $0} END {printf "\n"}' \
#       hs1.fa > ~/bench-refs/REF-HS1.oneline.fa
reference_override = "~/bench-refs/{reference_id}.oneline.fa"
# x86-ONLY, AND ITS SIMD PATH IS NOT INTERCHANGEABLE WITH ITS SCALAR ONE.
# mapquik's k-min-mer crate (rust-seq2kminmers) exports an AVX-512 ntHash
# iterator behind #![feature(stdarch_x86_avx512)], compiled unconditionally, so
# the crate does not build off x86 and needs a nightly toolchain on it. mapquik
# has a --nosimd switch, which looks like the way to get an aarch64 build.
# Measured on a2 (2026-08-10, B01, 148 225 reads):
#
#   two runs of the identical default command   148 225 records, 100.00% equal
#   default vs --nosimd                         39 701 records differ (26.8%),
#                                               and one read maps only under
#                                               the default path
#
# The control being exact is what makes that conclusive: mapquik is
# deterministic in content -- two default runs differ only in record order,
# because it writes from 32 threads -- so every one of those differences is
# the SIMD path's. --nosimd is a different tool, not a portable build of the
# same one, and an aarch64 corpus built that way could not be compared with
# this one. It would need a NEON ntHash reproducing the AVX-512 one exactly.
#
# The corollary for these numbers: they are specific to a host with AVX-512.
#
# The closest published analogue to shmap-rs: sketch-based, minimizer-space,
# PAF out, no base-level alignment. Its paper states performance degrades
# markedly below 97% read-reference identity — the same wall shmap-rs hits on
# ONT — so it is the right peer for a low-divergence mapper, and the wrong tool
# to judge ONT results by.
skip_benchmarks = ["B05"]
note = "HiFi/low-divergence only; skipped on ONT, where it is out of its stated design range."

# bwa-mem2 — https://github.com/bwa-mem2/bwa-mem2, IPDPS 2019,
# doi:10.1109/IPDPS.2019.00041, arXiv:1907.12931.
#
# The closest published analogue to what shmap-rs IS, as opposed to what it
# does. mapquik is the algorithmic peer — sketch-based, minimizer-space, PAF
# out. bwa-mem2 is the peer in KIND: a from-scratch reimplementation of an
# established mapper (bwa-mem) whose entire claim is that it produces identical
# output faster, 1.3-3.1x, by architecture-aware optimisation. That is the same
# claim this port makes about the C++ shmap, argued in the same venue —
# a parallel-computing conference rather than a methods journal.
#
# THIS IS AN ALIGNER, NOT A MAPPER, and the two differences that follow are
# not cosmetic:
#
#   1. It emits SAM with base-level alignments, not PAF. The command line pipes
#      through sam2paf.py; `time` wraps only the first stage of the pipeline,
#      so what is measured is bwa-mem2 and not the converter draining it.
#   2. It does full Smith-Waterman extension where the others stop at
#      coordinates. On long reads that is a large part of why it is slow here,
#      and it is work the other mappers never do — so a wall-time ratio
#      against it is not a like-for-like algorithmic comparison and must not
#      be quoted as one. What IS like-for-like is where the reads land, which
#      is what concordance measures.
#
# ON LONG READS IT IS OUT OF ITS DESIGN RANGE. bwa-mem was built for ~100-250 bp
# reads; `-x pacbio` and `-x ont2d` are its own documented long-read presets and
# are the honest choice, but nobody maps 24 kb reads with it in 2026. It is
# included on B01-B05 because a peer that is only ever shown its best case is
# not evidence, and excluded from nothing — the short-read benchmarks are where
# it is at home, and both halves are reported together.
[external.bwa-mem2]
binary = "~/micromamba/envs/refmappers/bin/bwa-mem2"
# `bwa-mem2 version` reports 2.2.1 FROM THE 2.3 PACKAGE — upstream never bumped
# the string. The cache key is keyed on this, so on its own it cannot tell a
# 2.2.1 corpus from a 2.3 one, and a silent version change is exactly what the
# staleness check exists to catch. The bioconda package record is appended
# because it carries the real version and the build hash, and the build hash
# differs between our two hosts on purpose: x86_64 gets upstream's five SIMD
# variants plus a dispatcher, aarch64 gets one binary built through sse2neon.
version_cmd = 'echo "$({binary} version 2>/dev/null) [$(basename $(ls $(dirname {binary})/../conda-meta/bwa-mem2-*.json | head -1) .json)]"'
cmd = "{binary} mem -t {threads} -x {preset} {reference} {reads} | {scripts}/sam2paf.py"
output = "stdout"
threads = 32
role = "peer"
# bwa's preset names for the same two things minimap2 calls map-pb / map-ont.
# Declared rather than duplicated into [external.presets], so there is exactly
# one statement in this file of what each benchmark's reads ARE. Inline, not a
# [external.bwa-mem2.preset_map] sub-table: a table header would capture every
# key written after it, silently moving reference_override into the map.
preset_map = { "map-pb" = "pacbio", "map-ont" = "ont2d" }
# It needs an FM-index, not a FASTA, and `bwa-mem2 mem` takes the index PREFIX.
# The prefix here is a symlink to the registry's hs1.fa with the index files
# beside it, so the ~10 GB of derived index lands in bench-refs with the other
# derived inputs and the dataset corpus stays exactly as the registry describes
# it. Built by benchmarks/scripts/setup_bwa_mem2.sh; needs ~87 GB of RAM, which
# is why it is a script and not a line in a runbook.
reference_override = "~/bench-refs/{reference_id}.bwamem2.fa"
note = "Aligner, not a mapper: emits SAM and does base-level extension. Long-read presets are bwa's own, and long reads are outside what it was built for."

# Which preset each benchmark's reads need. ONT has a different error profile
# and must not be mapped with the PacBio preset. validate_suite.py checks that
# every benchmark appears here.
[external.presets]
B01 = "map-pb"
B02 = "map-pb"
B03 = "map-pb"
B04 = "map-pb"
B05 = "map-ont"
